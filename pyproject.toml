[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "plantmemory"
version = "1.0.0"
description = "Computable Management of Change for computational chemical plants: grounded knowledge, change-impact propagation, risk tiering, alarm replay and change verification."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Akshat Dhamija" }]
keywords = [
  "process-safety", "management-of-change", "moc",
  "knowledge-management", "drift-detection", "chemical-engineering",
]
dependencies = ["pyyaml>=5.4", "numpy>=1.22", "scipy>=1.8", "duckdb>=0.9"]

[project.optional-dependencies]
dev = ["matplotlib>=3.5", "pytest>=7"]

[project.scripts]
plantmemory = "plant_memory.launch:main"

[tool.setuptools]
packages = ["plant_memory"]
include-package-data = true

[tool.setuptools.package-data]
plant_memory = ["hub_static/*", "store/**/*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
